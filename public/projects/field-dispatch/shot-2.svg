<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Field Dispatch Shot 2 - Evidence and Handover">
  <rect width="1200" height="750" fill="#f8fafc"/>
  
  <defs>
    <pattern id="dotGrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#dotGrid2)"/>

  <!-- Top Title Bar -->
  <g transform="translate(60, 45)">
    <text x="0" y="20" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">BUKTI DIGITAL NIR-KERTAS · AUDIT TRAIL</text>
    <text x="0" y="52" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="26" font-weight="800" fill="#0f172a">2. Foto Kondisi Muatan &amp; Tanda Tangan Mandor Site</text>
  </g>

  <!-- Phone 1 (Photo Capture Grid) -->
  <g transform="translate(180, 110)">
    <rect x="-6" y="-6" width="372" height="602" rx="38" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="360" height="590" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

    <g transform="translate(25, 40)">
      <text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="800" fill="#0f172a">DOKUMENTASI FISIK SITE</text>
      <text x="0" y="34" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Wajib unggah foto sebelum serah-terima</text>

      <!-- Photos Grid -->
      <g transform="translate(0, 48)">
        <!-- Photo Card 1 -->
        <rect x="0" y="0" width="148" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="10" y="10" width="128" height="75" rx="4" fill="#e2e8f0"/>
        <path d="M25 65l30-30 20 20 30-30 15 15" stroke="#64748b" stroke-width="2" fill="none"/>
        <circle cx="105" cy="30" r="6" fill="#94a3b8"/>
        <text x="10" y="105" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" font-weight="700" fill="#334155">FOTO MUATAN TRUK</text>

        <!-- Photo Card 2 -->
        <rect x="162" y="0" width="148" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="172" y="10" width="128" height="75" rx="4" fill="#e2e8f0"/>
        <rect x="195" y="25" width="80" height="45" rx="2" fill="#cbd5e1"/>
        <line x1="205" y1="40" x2="265" y2="40" stroke="#64748b" stroke-width="2"/>
        <text x="172" y="105" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" font-weight="700" fill="#334155">SEGEL PENGIRIMAN</text>

        <!-- Photo Card 3 -->
        <rect x="0" y="132" width="148" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="10" y="142" width="128" height="75" rx="4" fill="#e2e8f0"/>
        <polygon points="50,160 80,205 20,205" fill="#cbd5e1"/>
        <text x="10" y="237" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" font-weight="700" fill="#334155">AREA SITE BONGKAR</text>

        <!-- Add Photo Box -->
        <rect x="162" y="132" width="148" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4 4" stroke-width="1.5"/>
        <circle cx="236" cy="180" r="16" fill="#dbeafe"/>
        <line x1="236" y1="172" x2="236" y2="188" stroke="#2563eb" stroke-width="2"/>
        <line x1="228" y1="180" x2="244" y2="180" stroke="#2563eb" stroke-width="2"/>
        <text x="236" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" font-weight="700" fill="#2563eb">+ TAMBAH FOTO</text>
      </g>

      <!-- GPS Geotag Lock Badge -->
      <g transform="translate(0, 375)">
        <rect x="0" y="0" width="310" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="24" cy="26" r="8" fill="#ecfdf5"/>
        <circle cx="24" cy="26" r="3" fill="#059669"/>
        <text x="42" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">GPS: -6.1951, 106.8229</text>
        <text x="42" y="38" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" fill="#059669">Tervalidasi di dalam radius site proyek</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 442)">
        <rect x="0" y="0" width="310" height="46" rx="8" fill="#2563eb"/>
        <text x="155" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="13" font-weight="700" fill="#ffffff">LANJUT TANDA TANGAN</text>
      </g>
    </g>
  </g>

  <!-- Phone 2 (Digital Handover Signature Pad) -->
  <g transform="translate(660, 110)">
    <rect x="-6" y="-6" width="372" height="602" rx="38" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="360" height="590" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

    <g transform="translate(25, 40)">
      <text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="800" fill="#0f172a">PENGESAHAN MANDOR SITE</text>
      <text x="0" y="34" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Goreskan tanda tangan di layar sentuh</text>

      <!-- Signature Pad Canvas -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="310" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <!-- Real Signature Vector Path in Deep Blue Ink -->
        <path d="M40 120 C 60 70, 75 140, 95 90 C 110 50, 130 160, 150 110 C 170 80, 200 130, 250 100" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <line x1="20" y1="145" x2="290" y2="145" stroke="#e2e8f0" stroke-width="1"/>
        <text x="20" y="162" font-family="monospace" font-size="10" fill="#94a3b8">Area Tanda Tangan Layar Sentuh</text>
      </g>

      <!-- Signee Name & Notes -->
      <g transform="translate(0, 235)">
        <text x="0" y="14" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="600" fill="#64748b">Nama Mandor Penerima:</text>
        <rect x="0" y="22" width="310" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="14" y="46" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="700" fill="#0f172a">Bambang S. (Supervisor Site)</text>

        <text x="0" y="80" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="600" fill="#64748b">Catatan Serah Terima:</text>
        <rect x="0" y="88" width="310" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="14" y="108" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#334155">Semua panel utuh tanpa cacat muat.</text>
        <text x="14" y="124" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" fill="#64748b">Diterima lengkap pukul 14:10 WIB</text>
      </g>

      <!-- Submit Final Button -->
      <g transform="translate(0, 442)">
        <rect x="0" y="0" width="310" height="46" rx="8" fill="#059669"/>
        <text x="155" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="13" font-weight="700" fill="#ffffff">SAHKAN SURAT JALAN</text>
      </g>
    </g>
  </g>
</svg>
