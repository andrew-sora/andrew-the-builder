<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Field Dispatch Engine Cover">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Outer Card Frame -->
  <rect x="40" y="40" width="1120" height="670" rx="16" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Hero Panel (Architecture & Metrics) -->
  <g transform="translate(80, 90)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10b981"/>
    <text x="30" y="21" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">MOBILE-FIRST PWA · OFFLINE</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Field Dispatch &amp; DO</text>
    <text x="0" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="url(#brandGrad)">Digital Tracking Engine</text>

    <!-- Subtitle / Meta -->
    <text x="0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#94a3b8" width="450">
      <tspan x="0" dy="0">Sistem PWA mobile pelacak surat jalan &amp; audit trail material</tspan>
      <tspan x="0" dy="24">lapangan untuk kontraktor komersial &amp; interior arsitektur.</tspan>
      <tspan x="0" dy="24">Dirancang tetap berfungsi 100% di basement minim sinyal.</tspan>
    </text>

    <!-- Feature Cards -->
    <g transform="translate(0, 260)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="220" height="110" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="18" y="32" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="700">OFFLINE ENGINE</text>
      <text x="18" y="58" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">IndexedDB Sync</text>
      <text x="18" y="84" font-family="-apple-system,sans-serif" font-size="12" fill="#64748b">Zero-data loss background queue</text>

      <!-- Card 2 -->
      <rect x="236" y="0" width="220" height="110" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="254" y="32" font-family="monospace" font-size="12" fill="#10b981" font-weight="700">VERIFICATION</text>
      <text x="254" y="58" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">QR &amp; Geotag</text>
      <text x="254" y="84" font-family="-apple-system,sans-serif" font-size="12" fill="#64748b">Tamper-proof photo evidence</text>
    </g>

    <!-- Architecture Tag Pills -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e293b"/>
      <text x="14" y="18" font-family="monospace" font-size="11" fill="#cbd5e1">Next.js 15</text>

      <rect x="115" y="0" width="115" height="28" rx="6" fill="#1e293b"/>
      <text x="129" y="18" font-family="monospace" font-size="11" fill="#cbd5e1">Mobile PWA</text>

      <rect x="240" y="0" width="125" height="28" rx="6" fill="#1e293b"/>
      <text x="254" y="18" font-family="monospace" font-size="11" fill="#cbd5e1">PostgreSQL RLS</text>

      <rect x="375" y="0" width="100" height="28" rx="6" fill="#1e293b"/>
      <text x="389" y="18" font-family="monospace" font-size="11" fill="#cbd5e1">Web Audio</text>
    </g>
  </g>

  <!-- Right Mobile Screen Mockup (High Fidelity Phone) -->
  <g transform="translate(680, 75)">
    <!-- Phone Outer Body -->
    <rect x="0" y="0" width="380" height="600" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
    <!-- Phone Screen -->
    <rect x="12" y="12" width="356" height="576" rx="28" fill="url(#phoneGrad)"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="120" y="22" width="140" height="22" rx="11" fill="#020617"/>
    <circle cx="235" cy="33" r="4" fill="#1e293b"/>

    <!-- App Header Bar inside Phone -->
    <g transform="translate(26, 60)">
      <text x="0" y="18" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#f8fafc">SURAT JALAN DIGITAL</text>
      <rect x="225" y="2" width="100" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="236" cy="13" r="3.5" fill="#34d399"/>
      <text x="246" y="17" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">ONLINE SYNC</text>
    </g>

    <!-- Active Delivery Order Card -->
    <g transform="translate(26, 105)">
      <rect x="0" y="0" width="328" height="130" rx="12" fill="#0b1329" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="16" y="28" font-family="monospace" font-size="11" fill="#60a5fa" font-weight="700">NO. DO: SJ-2026-X891</text>
      <rect x="240" y="14" width="72" height="20" rx="4" fill="#1e3a8a"/>
      <text x="248" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#bfdbfe">TRANSIT</text>

      <text x="16" y="56" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Site Mall Grand Indonesia</text>
      <text x="16" y="76" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3b8">Fit-out Luxury Store · Lt. 2 West Mall</text>

      <!-- Step indicator bar -->
      <line x1="16" y1="102" x2="312" y2="102" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="102" x2="160" y2="102" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="16" cy="102" r="5" fill="#3b82f6"/>
      <circle cx="115" cy="102" r="5" fill="#3b82f6"/>
      <circle cx="214" cy="102" r="4" fill="#475569"/>
      <circle cx="312" cy="102" r="4" fill="#475569"/>
    </g>

    <!-- QR Code Scan Quick-Action Button -->
    <g transform="translate(26, 252)">
      <rect x="0" y="0" width="328" height="52" rx="10" fill="#2563eb"/>
      <path d="M24 16h6v6h-6zm0 14h6v6h-6zm14-14h6v6h-6zm10 0h4v4h-4zm0 8h4v6h-4zm-6 6h4v4h-4zm6 0h4v4h-4z" fill="#ffffff"/>
      <text x="56" y="32" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#ffffff">PINDAI QR KODE SURAT JALAN</text>
    </g>

    <!-- Manifest Items List -->
    <g transform="translate(26, 320)">
      <text x="0" y="16" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#94a3b8">MANIFEST BARANG (3 ITEM)</text>

      <!-- Item 1 -->
      <rect x="0" y="28" width="328" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="22" cy="52" r="7" fill="#065f46"/>
      <path d="M19 52l2 2 4-4" stroke="#34d399" stroke-width="1.5" fill="none"/>
      <text x="38" y="47" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Custom Panel Wall Kayu Jati</text>
      <text x="38" y="64" font-family="-apple-system,sans-serif" font-size="11" fill="#64748b">Jml: 24 unit · Dim: 240x60cm</text>
      <rect x="260" y="40" width="54" height="22" rx="4" fill="#064e3b"/>
      <text x="266" y="55" font-family="monospace" font-size="10" font-weight="700" fill="#6ee7b7">SESUAI</text>

      <!-- Item 2 -->
      <rect x="0" y="84" width="328" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="22" cy="108" r="7" fill="#065f46"/>
      <path d="M19 108l2 2 4-4" stroke="#34d399" stroke-width="1.5" fill="none"/>
      <text x="38" y="103" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Stainless Steel Showcase Frame</text>
      <text x="38" y="120" font-family="-apple-system,sans-serif" font-size="11" fill="#64748b">Jml: 8 set · Mirror Gold Finish</text>
      <rect x="260" y="96" width="54" height="22" rx="4" fill="#064e3b"/>
      <text x="266" y="111" font-family="monospace" font-size="10" font-weight="700" fill="#6ee7b7">SESUAI</text>

      <!-- Item 3 -->
      <rect x="0" y="140" width="328" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="22" cy="164" r="7" fill="#78350f"/>
      <path d="M19 164h6" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
      <text x="38" y="159" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Tempered Glass Display Box</text>
      <text x="38" y="176" font-family="-apple-system,sans-serif" font-size="11" fill="#64748b">Jml: 4 unit · Tebal 10mm</text>
      <rect x="260" y="152" width="54" height="22" rx="4" fill="#78350f"/>
      <text x="266" y="167" font-family="monospace" font-size="10" font-weight="700" fill="#fde68a">CEK SITE</text>
    </g>

    <!-- Bottom Home Indicator -->
    <rect x="130" y="565" width="120" height="4" rx="2" fill="#64748b"/>
  </g>
</svg>

