<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Field Dispatch Engine Cover">
  <!-- Clean Enterprise Canvas Background -->
  <rect width="1200" height="750" fill="#f8fafc"/>
  
  <!-- Subtle Architectural Grid -->
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#dotGrid)"/>

  <!-- Left Content Area (Overview & Architecture) -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="230" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="14" cy="15" r="4" fill="#2563eb"/>
    <text x="26" y="20" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.5">SISTEM SURAT JALAN (DO) DIGITAL</text>

    <!-- Main Title (Solid Crisp Typography, No Artificial Gradients) -->
    <text x="0" y="74" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Field Dispatch &amp; Tracking</text>
    <text x="0" y="116" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#475569">Solusi Logistik Lapangan Offline-First</text>

    <!-- Description -->
    <text x="0" y="165" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="14.5" fill="#334155" line-height="1.6">
      <tspan x="0" dy="0">PWA mobile untuk memverifikasi rantai pasok material interior</tspan>
      <tspan x="0" dy="24">dari pabrikasi ke lokasi proyek komersial. Beroperasi penuh di</tspan>
      <tspan x="0" dy="24">basement gedung tanpa sinyal seluler via antrean IndexedDB.</tspan>
    </text>

    <!-- Key Metrics Cards -->
    <g transform="translate(0, 260)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="220" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">VERIFIKASI FISIK</text>
      <text x="20" y="58" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="20" font-weight="800" fill="#0f172a">QR &amp; Geofence</text>
      <text x="20" y="80" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" fill="#059669" font-weight="600">Anti-manipulasi berkas</text>

      <!-- Metric 2 -->
      <rect x="236" y="0" width="220" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="256" y="30" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">TOLERANSI SINYAL</text>
      <text x="256" y="58" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="20" font-weight="800" fill="#0f172a">Zero Signal</text>
      <text x="256" y="80" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" fill="#2563eb" font-weight="600">Sinkronisasi lokal instan</text>
    </g>

    <!-- Technical Stack Badges -->
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="110" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#334155">Next.js 15</text>

      <rect x="120" y="0" width="115" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="134" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#334155">Mobile PWA</text>

      <rect x="245" y="0" width="115" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="259" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#334155">IndexedDB</text>

      <rect x="370" y="0" width="115" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="384" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#334155">PostgreSQL</text>
    </g>
  </g>

  <!-- Right Mobile Screen Frame (Realistic Phone with Clean White Enterprise UI) -->
  <g transform="translate(680, 65)">
    <!-- Shadow & Phone Bezel -->
    <rect x="-8" y="-8" width="376" height="616" rx="40" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="360" height="600" rx="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="120" y="14" width="120" height="18" rx="9" fill="#0f172a"/>

    <!-- App Top Navigation inside Phone -->
    <g transform="translate(24, 50)">
      <text x="0" y="18" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="800" fill="#0f172a">SURAT JALAN LAPANGAN</text>
      <rect x="210" y="2" width="102" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="221" cy="13" r="3.5" fill="#059669"/>
      <text x="229" y="17" font-family="monospace" font-size="10" font-weight="700" fill="#065f46">OFFLINE OK</text>
    </g>

    <!-- Active Delivery Order Card -->
    <g transform="translate(24, 92)">
      <rect x="0" y="0" width="312" height="135" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <text x="14" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">DO-2026-X891</text>
      <rect x="206" y="12" width="92" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="214" y="27" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">PENGIRIMAN</text>

      <!-- Project Destination -->
      <text x="14" y="54" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="15" font-weight="700" fill="#0f172a">Fit-out Butik Luxury Store</text>
      <text x="14" y="74" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" fill="#64748b">Site: Grand Indonesia Mall Lt. 2</text>

      <!-- Step Timeline Line -->
      <line x1="14" y1="105" x2="298" y2="105" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="105" x2="160" y2="105" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <circle cx="14" cy="105" r="5" fill="#2563eb"/>
      <circle cx="110" cy="105" r="5" fill="#2563eb"/>
      <circle cx="204" cy="105" r="4" fill="#cbd5e1"/>
      <circle cx="298" cy="105" r="4" fill="#cbd5e1"/>
    </g>

    <!-- Scan Trigger Button (Solid Enterprise Blue, Zero AI Glow) -->
    <g transform="translate(24, 242)">
      <rect x="0" y="0" width="312" height="46" rx="8" fill="#2563eb"/>
      <text x="156" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="13" font-weight="700" fill="#ffffff">PINDAI QR DI SITE BONGKAR</text>
    </g>

    <!-- Manifest Items List -->
    <g transform="translate(24, 305)">
      <text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="700" fill="#64748b">DAFTAR BARANG (3 ITEM)</text>

      <!-- Item 1 -->
      <rect x="0" y="26" width="312" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="20" cy="52" r="7" fill="#ecfdf5"/>
      <path d="M17 52l2 2 4-4" stroke="#059669" stroke-width="1.8" fill="none"/>
      <text x="36" y="46" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="600" fill="#0f172a">Panel Dinding Kayu Jati</text>
      <text x="36" y="63" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">24 unit · 240x60cm</text>
      <rect x="246" y="41" width="56" height="22" rx="4" fill="#ecfdf5"/>
      <text x="254" y="56" font-family="monospace" font-size="10" font-weight="700" fill="#059669">LENGKAP</text>

      <!-- Item 2 -->
      <rect x="0" y="86" width="312" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="20" cy="112" r="7" fill="#ecfdf5"/>
      <path d="M17 112l2 2 4-4" stroke="#059669" stroke-width="1.8" fill="none"/>
      <text x="36" y="106" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="600" fill="#0f172a">Rangka Stainless Gold Mirror</text>
      <text x="36" y="123" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">8 set · QC Passed</text>
      <rect x="246" y="101" width="56" height="22" rx="4" fill="#ecfdf5"/>
      <text x="254" y="116" font-family="monospace" font-size="10" font-weight="700" fill="#059669">LENGKAP</text>

      <!-- Item 3 -->
      <rect x="0" y="146" width="312" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="20" cy="172" r="7" fill="#fffbeb"/>
      <path d="M17 172h6" stroke="#d97706" stroke-width="2" fill="none"/>
      <text x="36" y="166" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="600" fill="#0f172a">Showcase Kaca Tempered 10mm</text>
      <text x="36" y="183" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">4 unit · Fragile Handling</text>
      <rect x="246" y="161" width="56" height="22" rx="4" fill="#fffbeb"/>
      <text x="252" y="176" font-family="monospace" font-size="10" font-weight="700" fill="#b45309">CEK SITE</text>
    </g>

    <!-- Bottom Home Bar -->
    <rect x="130" y="582" width="100" height="4" rx="2" fill="#94a3b8"/>
  </g>
</svg>
