<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Field Dispatch Shot 1 - Mobile Offline QR Scanning">
  <rect width="1200" height="750" fill="#f8fafc"/>
  
  <defs>
    <pattern id="dotGrid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#dotGrid1)"/>

  <!-- Top Title Bar -->
  <g transform="translate(60, 45)">
    <text x="0" y="20" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">ALUR LAPANGAN MOBILE-FIRST · ZERO-SIGNAL TOLERANCE</text>
    <text x="0" y="52" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="26" font-weight="800" fill="#0f172a">1. Pindai QR Valid &amp; Antrean Sinkronisasi Lokal</text>
  </g>

  <!-- Phone 1 (QR Scanner Viewport) -->
  <g transform="translate(180, 110)">
    <rect x="-6" y="-6" width="372" height="602" rx="38" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="360" height="590" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

    <g transform="translate(25, 40)">
      <text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="800" fill="#0f172a">PEMINDAI SURAT JALAN</text>
      <text x="0" y="34" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Arahkan kamera ke QR pada lembar muatan</text>

      <!-- Camera Viewport Box -->
      <rect x="0" y="48" width="310" height="310" rx="12" fill="#0f172a"/>

      <!-- QR Frame Reticle -->
      <path d="M40 90 h-20 v20" stroke="#ffffff" stroke-width="3" fill="none"/>
      <path d="M270 90 h20 v20" stroke="#ffffff" stroke-width="3" fill="none"/>
      <path d="M40 310 h-20 v-20" stroke="#ffffff" stroke-width="3" fill="none"/>
      <path d="M270 310 h20 v-20" stroke="#ffffff" stroke-width="3" fill="none"/>

      <!-- Simulated QR Code Pattern inside -->
      <g transform="translate(95, 135)" fill="#ffffff" fill-opacity="0.85">
        <rect x="0" y="0" width="36" height="36" rx="4"/>
        <rect x="84" y="0" width="36" height="36" rx="4"/>
        <rect x="0" y="84" width="36" height="36" rx="4"/>
        <rect x="8" y="8" width="20" height="20" fill="#0f172a"/>
        <rect x="92" y="8" width="20" height="20" fill="#0f172a"/>
        <rect x="8" y="92" width="20" height="20" fill="#0f172a"/>
        <rect x="48" y="10" width="12" height="12"/>
        <rect x="68" y="24" width="10" height="10"/>
        <rect x="44" y="48" width="32" height="32" rx="2"/>
        <rect x="86" y="58" width="14" height="26"/>
        <rect x="18" y="54" width="16" height="16"/>
        <rect x="48" y="94" width="20" height="16"/>
        <rect x="78" y="94" width="32" height="16"/>
      </g>

      <!-- Scan Beam -->
      <line x1="20" y1="200" x2="290" y2="200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>

      <!-- Success Notification Chip -->
      <g transform="translate(0, 375)">
        <rect x="0" y="0" width="310" height="54" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
        <circle cx="26" cy="27" r="12" fill="#059669"/>
        <path d="M20 27l4 4 8-8" stroke="#ffffff" stroke-width="2" fill="none"/>
        <text x="48" y="24" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="700" fill="#065f46">QR Terverifikasi: DO-2026-X891</text>
        <text x="48" y="40" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#047857">Umpan balik audio &amp; getar aktif</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 442)">
        <rect x="0" y="0" width="310" height="46" rx="8" fill="#2563eb"/>
        <text x="155" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="13" font-weight="700" fill="#ffffff">BUKA DETAIL MANIFEST</text>
      </g>
    </g>
  </g>

  <!-- Phone 2 (Offline Queue Sync Status) -->
  <g transform="translate(660, 110)">
    <rect x="-6" y="-6" width="372" height="602" rx="38" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="360" height="590" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

    <g transform="translate(25, 40)">
      <text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="800" fill="#0f172a">STATUS SINKRONISASI OFFLINE</text>
      <text x="0" y="34" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Data tersimpan aman di IndexedDB HP</text>

      <!-- Offline Banner -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="310" height="64" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
        <circle cx="26" cy="32" r="10" fill="#d97706"/>
        <text x="23" y="36" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">!</text>
        <text x="48" y="26" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="700" fill="#92400e">KONEKSI INTERNET TERPUTUS</text>
        <text x="48" y="44" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#b45309">3 aksi lapangan tersimpan lokal di IndexedDB</text>
      </g>

      <!-- Queue List -->
      <g transform="translate(0, 130)">
        <text x="0" y="14" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="700" fill="#64748b">ANTREAN LAPANGAN (AUTO-SYNC)</text>

        <!-- Queue Item 1 -->
        <rect x="0" y="24" width="310" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="46" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">CHECKPOINT: SITE ARRIVAL</text>
        <text x="14" y="64" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Pukul 13:42 WIB · Lokasi Grand Indonesia</text>
        <rect x="236" y="38" width="60" height="22" rx="4" fill="#e2e8f0"/>
        <text x="244" y="52" font-family="monospace" font-size="9" font-weight="700" fill="#475569">TERSIMPAN</text>

        <!-- Queue Item 2 -->
        <rect x="0" y="90" width="310" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="112" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">FOTO BUKTI: 4 BERKAS WEBP</text>
        <text x="14" y="130" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Kompresi client 120KB per foto</text>
        <rect x="236" y="104" width="60" height="22" rx="4" fill="#e2e8f0"/>
        <text x="244" y="118" font-family="monospace" font-size="9" font-weight="700" fill="#475569">TERSIMPAN</text>

        <!-- Queue Item 3 -->
        <rect x="0" y="156" width="310" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="178" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">TANDA TANGAN MANDOR</text>
        <text x="14" y="196" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" fill="#64748b">Geotagging + Vektor Canvas</text>
        <rect x="236" y="170" width="60" height="22" rx="4" fill="#e2e8f0"/>
        <text x="244" y="184" font-family="monospace" font-size="9" font-weight="700" fill="#475569">TERSIMPAN</text>
      </g>

      <!-- Sync Trigger -->
      <g transform="translate(0, 442)">
        <rect x="0" y="0" width="310" height="46" rx="8" fill="#059669"/>
        <text x="155" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="13" font-weight="700" fill="#ffffff">OTOMATIS SYNC SAAT ADA SINYAL</text>
      </g>
    </g>
  </g>
</svg>
