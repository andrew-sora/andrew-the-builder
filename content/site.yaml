about:
  id: >-
    Saya lulusan Teknologi Informasi Universitas Gadjah Mada yang akhirnya bekerja di seluruh lapisan: produk web
    dan mobile, jaringan optik, keamanan, dan AI di production. Saya suka memegang satu masalah dari sketsa pertama
    sampai sistemnya berjalan, jadi saya bisa berpindah antara frontend Next.js, backend Supabase, jalur fiber, dan
    container penyaji model tanpa melempar masalahnya ke orang lain.
    [Satu kalimat tentang apa yang sedang Anda bangun atau cari saat ini.]
  en: >-
    I'm an Information Technology graduate from Universitas Gadjah Mada who ended up working across the whole stack:
    web and mobile products, optical networks, security and production AI. I like owning a problem from the first
    sketch to the running system, so I can move between a Next.js frontend, a Supabase backend, a fiber route and a
    model-serving container without handing the problem off.
    [One sentence on what you are building or looking for right now.]

