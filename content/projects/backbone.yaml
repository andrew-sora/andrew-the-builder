text:
  id:
    title: Infrastruktur Jaringan Optik & Server
    tagline: Operasional infrastruktur jaringan DWDM dan manajemen pemulihan insiden server.
    role: Team Leader – Operasional Infrastruktur (PT Bach Multi Infrastruktur)
    problem: Infrastruktur jaringan transmisi optik DWDM membutuhkan ketersediaan tinggi (high availability) dan penanganan insiden cepat di lapangan guna mencegah pemadaman jaringan telekomunikasi skala luas.
    approach: Memimpin operasional teknis lapangan lintas site, melakukan pemantauan sistem transmisi, perutean fiber optik, dan konfigurasi server pendukung. Merancang SOP pemulihan insiden darurat untuk meminimalkan waktu henti (downtime) serta mengoptimalkan alokasi sumber daya teknis.
    highlights:
      - Memimpin tim teknis operasional lapangan untuk menjaga SLA uptime infrastruktur optik berkinerja tinggi.
      - Manajemen insiden cepat dan mitigasi gangguan transmisi optik DWDM di berbagai lokasi site.
      - Standarisasi alur diagnosis teknis dan pengelolaan konfigurasi server pendukung berbasis Linux dan Docker.
  en:
    title: Optical Network & Server Infrastructure
    tagline: DWDM optical transmission operations and high-availability server incident management.
    role: Team Leader – Infrastructure Operations (PT Bach Multi Infrastruktur)
    problem: DWDM optical transmission networks require strict high-availability SLAs and rapid on-site incident response to prevent mission-critical telecommunication blackouts.
    approach: Led on-site technical operations across multiple sites, managing optical transmission monitoring, fiber routing, and supporting server infrastructure. Authored emergency incident recovery SOPs to drastically reduce mean-time-to-repair (MTTR) while optimizing operational resource allocation.
    highlights:
      - Led technical field teams ensuring high-availability uptime across mission-critical optical infrastructure.
      - Rapid incident diagnostics and mitigation of DWDM transmission faults across diverse field sites.
      - Standardized technical operational SOPs and maintained Linux/Docker supporting server configurations.
