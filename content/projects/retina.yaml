text:
  id:
    title: Deteksi Retinopati Diabetik (Retina-AI)
    tagline: Model Computer Vision & REST API untuk deteksi otomatis penyakit retinopati diabetik.
    role: Lead Researcher & ML Engineer (Skripsi S1 TI UGM)
    problem: Skrining manual retinopati diabetik oleh dokter spesialis mata memakan waktu panjang dan prosedur bertahap yang rumit. Di tengah lonjakan pasien diabetes, keterlambatan diagnosis dini sering kali berujung pada kerusakan penglihatan permanen atau kebutaan total.
    approach: Merancang dan melatih model Convolutional Neural Network (CNN) berbasis PyTorch untuk mengklasifikasikan citra fundus retina secara otomatis. Model inferensi dikemas ke dalam layanan REST API berlatensi rendah menggunakan FastAPI dan dikontainerisasi dengan Docker, memungkinkan integrasi lintas platform web medis tanpa kendala spesifikasi perangkat keras pengguna.
    highlights:
      - Riset karya akhir resmi S1 Teknologi Informasi Universitas Gadjah Mada (UGM, 2024) di bawah bimbingan Dr.Eng. Silmi Fauziati, S.T., M.T.
      - Arsitektur Convolutional Neural Network (CNN) untuk klasifikasi otomatis citra fundus retina dengan akurasi teruji.
      - Layanan inferensi REST API mandiri berbasis FastAPI dan Docker untuk kemudahan deployment dan skalabilitas.
      - Terpublikasi dan terindeks secara permanen di Repositori Ilmiah ETD Universitas Gadjah Mada.
  en:
    title: Diabetic Retinopathy Detection (Retina-AI)
    tagline: Computer vision model and REST API for automated diabetic retinopathy classification.
    role: Lead Researcher & ML Engineer (UGM Bachelor Thesis)
    problem: Manual screening for diabetic retinopathy by ophthalmologists is resource-intensive and procedurally complex. With rising diabetic populations, delayed clinical diagnosis frequently results in irreversible vision impairment or blindness.
    approach: Designed and trained a Convolutional Neural Network (CNN) pipeline in PyTorch to automate retinal fundus image grading. Packaged the inference pipeline into a high-performance REST API with FastAPI and containerized it with Docker, enabling lightweight cross-platform web integration independent of client hardware limitations.
    highlights:
      - Official Bachelor Thesis in Information Technology at Universitas Gadjah Mada (UGM, 2024), advised by Dr.Eng. Silmi Fauziati, S.T., M.T.
      - Deep Learning Convolutional Neural Network (CNN) architecture delivering automated fundus image grading.
      - Containerized, low-latency REST API inference service powered by FastAPI and Docker.
      - Officially indexed and archived in Universitas Gadjah Mada's ETD Academic Research Repository.
