text:
  id:
    title: Web Security Audit & Penetration Testing Lab
    tagline: Lab pengujian kerentanan web (SQLi, XSS, Command Injection) dan mitigasi hardening sistem.
    role: Security Engineer & Researcher
    problem: Aplikasi web modern rentan terhadap serangan injeksi dan kelemahan sanitasi input (OWASP Top 10) yang dapat menyebabkan kebocoran data sensitif serta eksekusi kode berbahaya tanpa izin.
    approach: Merancang lab simulasi audit keamanan berbasis DVWA untuk mendemonstrasikan eksploitasi celah SQL Injection, Cross-Site Scripting (XSS), dan Command Injection secara terarah. Menyusun analisis mendalam mengenai vektor serangan serta mengimplementasikan mitigasi berbasis prepared statements, sanitasi context-aware, dan hardening konfigurasi server web.
    highlights:
      - Laboratorium simulasi pengujian penetrasi mandiri yang mencakup analisis eksploitasi OWASP Top 10.
      - Dokumentasi terstruktur dan Proof of Concept (PoC) untuk remediasi SQLi, XSS, dan injeksi perintah.
      - Rekomendasi penerapan keamanan berlapis (defense-in-depth) pada layer aplikasi dan web server.
  en:
    title: Web Security Audit & Penetration Testing Lab
    tagline: Web vulnerability research lab demonstrating SQLi, XSS, Command Injection, and mitigation hardening.
    role: Security Engineer & Researcher
    problem: Modern web applications remain vulnerable to input sanitization flaws and injection attacks (OWASP Top 10), risking sensitive data breaches and unauthorized remote code execution.
    approach: Architected a hands-on web security testing environment utilizing DVWA to demonstrate targeted exploitation of SQL Injection, Cross-Site Scripting (XSS), and Command Injection vectors. Authored comprehensive remediation strategies incorporating prepared statements, context-aware input escaping, and secure web server configurations.
    highlights:
      - Hands-on penetration testing lab environment evaluating core OWASP Top 10 vulnerability vectors.
      - Documented Proof of Concepts (PoC) and verified defensive mitigations for injection flaws.
      - Formulated defense-in-depth security hardening recommendations across web application tiers.
